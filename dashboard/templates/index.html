<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 11 - Stabilization Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Active Stabilization &amp; Solar Tracking Platform</h1>
        <p class="subtitle">
            Live Dashboard
            <span id="connectionStatus" class="status-badge status-connecting">Connecting...</span>
        </p>
    </header>

    <main>
        <section class="card chart-card">
            <h2>Pitch &amp; Roll (degrees)</h2>
            <canvas id="orientationChart"></canvas>
        </section>

        <section class="card stats-card">
            <h2>Current Readings</h2>
            <dl>
                <dt>Pitch</dt><dd id="pitchValue">--</dd>
                <dt>Roll</dt><dd id="rollValue">--</dd>
                <dt>Power</dt><dd id="powerValue">--</dd>
            </dl>
        </section>

        <section class="card power-avg-card">
            <div class="power-avg-header">
                <h2>Average Power</h2>
                <span class="power-avg-window">last 60 samples</span>
            </div>
            <p class="power-avg-value"><span id="powerAvgValue">--</span> <span class="unit">W</span></p>
            <canvas id="powerAvgChart"></canvas>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/vendor/socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/chart.umd.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
